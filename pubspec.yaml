name: cologne_sanskrit_lexicon
description: Cologne Sanskrit Lexicon - offline dictionary app for the Cologne Digital Sanskrit Dictionaries.
publish_to: 'none'
version: 0.1.6+7

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # SQLite
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.4.0+1
  sqflite_common_ffi_web: ^1.1.1  # Web SQLite via IndexedDB/WASM

  # File system & networking
  path_provider: ^2.1.5
  path: ^1.9.0
  http: ^1.2.2
  archive: ^4.0.0

  # Transliteration
  indic_transliteration_dart: ^2.3.83

  # State management
  flutter_riverpod: ^2.5.1

  # Persistence
  shared_preferences: ^2.3.2

  # HTML rendering for definition bodies
  flutter_widget_from_html_core: ^0.17.0

  # URL launching (PDF / Correction links)
  url_launcher: ^6.3.2
  intl: ^0.20.2
  package_info_plus: ^8.3.1

  # Color picker for custom theme
  flex_color_picker: ^3.6.0

  # Markdown rendering for help content
  flutter_markdown_plus: ^1.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4



flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/sqlite/  # Pre-bundled dictionary SQLite files for web (WASM) deployment
  fonts:
    - family: Siddhanta
      fonts:
        - asset: assets/siddhanta.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/cologne_sanskrit_lexicon_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/cologne_sanskrit_lexicon_logo.png"
  adaptive_icon_round: true
  min_sdk_android: 21 # android min sdk min:16, default:21
  web:
    generate: true
    image_path: "assets/cologne_sanskrit_lexicon_logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/cologne_sanskrit_lexicon_logo.png"
    icon_size: 48 # min:48, default:256
  macos:
    generate: true
    image_path: "assets/cologne_sanskrit_lexicon_logo.png"
  linux:
    generate: true
    image_path: "assets/cologne_sanskrit_lexicon_logo.png"

