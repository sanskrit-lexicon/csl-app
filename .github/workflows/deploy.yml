name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Triggers on every push to main

  # Allow manual triggering from the Actions tab
  workflow_dispatch:

permissions:
  contents: write  # Required for peaceiris/actions-gh-pages to push to gh-pages branch


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Checkout repository ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Set up Flutter (stable channel) ──────────────────────────────
      # We do NOT pin a specific version to always get the latest stable Dart SDK.
      # flutter_lints ^6.0.0 requires Dart ^3.8.0 (available in Flutter 3.32+).
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ── Step 3: Install Dart/Flutter dependencies ────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── Step 4: Set up SQLite web assets ───────────────────────────────────────
      # Generates sqflite_sw.js and sqlite3.wasm required by sqflite_common_ffi_web.
      # Required for IndexedDB-backed SQLite in the browser.
      - name: Set up SQLite web assets
        run: |
          dart pub get
          dart run sqflite_common_ffi_web:setup

      # ── Step 5: Build Flutter Web ─────────────────────────────────────────────
      # --base-href must match your GitHub Pages URL sub-path.
      # This repo is served at: https://sanskrit-lexicon.github.io/csl-app/
      - name: Build Flutter Web (JS)
        run: flutter build web --release --base-href /csl-app/

      # ── Step 6: Deploy build/web to gh-pages branch ─────────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
          enable_jekyll: false
