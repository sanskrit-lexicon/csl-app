name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Triggers on every push to main

  # Allow manual triggering from the Actions tab
  workflow_dispatch:

permissions:
  contents: write  # Required for peaceiris/actions-gh-pages to push to gh-pages branch

# ─────────────────────────────────────────────────────────────────────────────
# CONFIGURE DICTIONARIES HERE
#
# List the dictionary codes (lowercase) you want bundled in the web build.
# Each code must have a matching {code}.zip at:
#   https://github.com/sanskrit-lexicon/csl-sqlite/releases/latest/download/{code}.zip
#
# The zip should contain one or more of:
#   {code}.sqlite              — main dictionary (required)
#   {code}ab.sqlite            — abbreviations (optional)
#   {code}authtooltips.sqlite  — source tooltips (optional)
#   {code}bib.sqlite           — bibliography (optional)
#
# To add/remove a dictionary: edit the DICTIONARIES list below and push to main.
# ─────────────────────────────────────────────────────────────────────────────
env:
  DICTIONARIES: "acc ae ap90 ap ben bhs bop bor bur cae ccs gra gst ieg inm krm mci md mw mw72 mwe pe pgn pui pw pwg sch shs skd snp stc vcp vei wil yat lan armh pwkvn lrv abch acph acsj fri"  # Space-separated list of dict codes to bundle

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Checkout repository ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Set up Flutter (stable channel) ──────────────────────────────
      # We do NOT pin a specific version to always get the latest stable Dart SDK.
      # flutter_lints ^6.0.0 requires Dart ^3.8.0 (available in Flutter 3.32+).
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ── Step 3: Install Dart/Flutter dependencies ────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── Step 4: Download SQLite dictionaries from csl-sqlite GitHub Releases ──
      # Fetches {code}.zip from sanskrit-lexicon/csl-sqlite latest release,
      # extracts all *.sqlite files into assets/sqlite/.
      # Files that don't exist (optional ab/authtooltips/bib) are skipped gracefully.
      - name: Download SQLite dictionaries from csl-sqlite releases
        run: |
          mkdir -p assets/sqlite

          BASE_URL="https://github.com/sanskrit-lexicon/csl-sqlite/releases/latest/download"

          for DICT in $DICTIONARIES; do
            ZIP_URL="${BASE_URL}/${DICT}.zip"
            TMP_ZIP="/tmp/${DICT}.zip"
            TMP_DIR="/tmp/${DICT}_extracted"

            echo "──────────────────────────────────────────"
            echo "Downloading: ${DICT}.zip from ${ZIP_URL}"

            # Download the zip. --fail makes curl return non-zero on HTTP errors.
            if curl -L --fail --silent --show-error --output "${TMP_ZIP}" "${ZIP_URL}"; then
              echo "✓ Downloaded ${DICT}.zip ($(du -h ${TMP_ZIP} | cut -f1))"

              # Extract into a temp dir, then copy only *.sqlite to assets/sqlite/
              mkdir -p "${TMP_DIR}"
              unzip -q -o "${TMP_ZIP}" -d "${TMP_DIR}"

              # Copy all .sqlite files found anywhere in the zip (handles nested paths)
              FOUND=0
              while IFS= read -r -d '' SQLITE_FILE; do
                BASENAME=$(basename "${SQLITE_FILE}")
                cp "${SQLITE_FILE}" "assets/sqlite/${BASENAME}"
                echo "  → assets/sqlite/${BASENAME} ($(du -h assets/sqlite/${BASENAME} | cut -f1))"
                FOUND=$((FOUND + 1))
              done < <(find "${TMP_DIR}" -name "*.sqlite" -print0)

              if [ "${FOUND}" -eq 0 ]; then
                echo "  ⚠ No .sqlite files found in ${DICT}.zip"
              fi

              # Clean up temp files
              rm -rf "${TMP_ZIP}" "${TMP_DIR}"
            else
              echo "  ⚠ Could not download ${DICT}.zip — skipping (check that the release asset exists)"
            fi
          done

          echo "──────────────────────────────────────────"
          echo "Final assets/sqlite/ contents:"
          ls -lh assets/sqlite/ || echo "(empty)"

      # ── Step 5: Set up SQLite web assets ────────────────────────────────────
      # Generates web/sqlite3.wasm and web/sqflite_sw.js required by
      # sqflite_common_ffi_web for IndexedDB-backed SQLite in the browser.
      - name: Set up SQLite web assets
        run: dart run sqflite_common_ffi_web:setup

      # ── Step 6: Build Flutter Web with WASM ─────────────────────────────────
      # --base-href must match your GitHub Pages URL sub-path.
      # This repo is served at: https://sanskrit-lexicon.github.io/csl-app/
      - name: Build Flutter Web (WASM)
        run: flutter build web --wasm --release --base-href /csl-app/

      # ── Step 7: Deploy build/web to gh-pages branch ─────────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
          enable_jekyll: false
